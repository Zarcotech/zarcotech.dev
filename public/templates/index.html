<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zarcotech</title>
    <link rel="stylesheet" href="../style/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/monolith.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>  
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div class="main-layout">
      <div class="container">
        <div class="header">
          <div class="pfp-container">
            <img src="pfp.png" alt="zarcotech" class="pfp" />
            <div class="activity" id="activity"></div>
          </div>
          <div class="info">
            <div class="socials">
              <i
                class="fa-brands fa-github social-icon"
                onclick="window.open('https://github.com/Zarcotech', '_blank')"
              ></i>
              <i
                class="fa-brands fa-discord"
                onclick="window.open('https://dsc.gg/iciclenetwork', '_blank')"
              ></i>
              <i
                class="fa-brands fa-spotify"
                onclick="window.open('https://open.spotify.com/user/31hc3za2akh4l2ebakjebphgqcs4?si=5439a49ffd5d46e3', '_blank')"
              ></i>
              <i
                class="fa-brands fa-instagram"
                onclick="window.open('https://www.instagram.com/ftc_cybersalam/', '_blank')"
              ></i>
              <i
                class="fa-brands fa-youtube"
                onclick="window.open('https://www.youtube.com/@CyberSalam_FTC', '_blank')"
              ></i>
            </div>
            <div class="live-info">
              <h1>Zarcotech</h1>
              <h3>Discord Presence: <span id="status"></span></h3>
            </div>
            <div class="controls">
              <label for="rainSpeed">Rain speed</label>
              <input
                id="rainSpeed"
                type="range"
                min="0.5"
                max="1.3"
                step="0.1"
                value="1"
                aria-label="Background rain speed"
              />
              <span id="rainSpeedValue" class="speed-value">1.00</span>
              <label for="themeSelect">Theme</label>
              <select
                id="themeSelect"
                aria-label="Background theme selector"
              ></select>
              <button id="clearThemes">
                Clear Custom Themes (Will reload page)
              </button>
            </div>
            <label>Create Your Own Theme!</label>
            <br />
          </div>
        </div>

        <div id="statusBubble">
          <div id="bubbleContent"></div>
          <div id="bubbleTail"></div>
        </div>

        <div id="musicStatus">
          <p id="musicHeader">LISTENING TO SPOTIFY</p>
          <div id="songDetails">
            <img id="albumArt" src="" alt="Album Art" />
            <div id="songText">
              <p id="songTitle"></p>
              <p id="songArtist"></p>
              <p id="songAlbum"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="createTheme header">
        <form>
          <label for="themeName">Theme Name:</label>
          <input
            type="text"
            id="themeName"
            name="themeName"
            placeholder="Theme1"
            value="Theme1"
          />
          <label for="newSnippets">Snippets:</label>
          <input
            type="text"
            id="newSnippets"
            name="newSnippets"
            placeholder="const, let, function, if, else, return, await, async, class, new, this, =>, console.log"
            value="const, let, function, if, else, return, await, async, class, new, this, =>, console.log"
          />
          <label for="textColor">Text Color:</label>
          <div class="color-picker"></div>
          <label for="bgAlpha">Background Opacity (0.0 - 1.0):</label>
          <input
            type="number"
            id="bgAlpha"
            name="bgAlpha"
            step="0.01"
            min="0.0"
            max="1.0"
            value="1"
          />
          <label for="fontSize">Font Size (px):</label>
          <input
            type="number"
            id="fontSize"
            name="fontSize"
            min="10"
            max="30"
            value="16"
          />
          <label for="rainSpeedInput">Rain Speed (0.5 - 2.0):</label>
          <input
            type="number"
            id="rainSpeedInput"
            name="rainSpeedInput"
            step="0.1"
            min="0.5"
            max="2.0"
            value="1"
          />
          <br />
        </form>
        <button class="sendTheme" type="button" onclick="sendNew()">Create Theme</button>
      </div>
    </div>
    <div class="hotbar"></div>
    <canvas id="backgroundCanvas"></canvas>
    <script src="../script/script.js"></script>
  </body>
</html>
